# Base encoder and shared chunker identity
model_name: distilbert/distilroberta-base
model_revision: fb53ab8802853c8e4fbdbcd0529f21fc6f459b2b
max_tokens: 512
overlap_tokens: 64

# Nested, grouped contract partitions: 260 train / 66 calibration / 82 evaluation
seed: 42
evaluation_fraction: 0.2
calibration_fraction: 0.2

# Training controls
learning_rate: 2.0e-5
epochs: 4
contracts_per_batch: 1
gradient_accumulation: 8
pos_weight_cap: 50.0
dropout: 0.2
