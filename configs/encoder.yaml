# Model & chunking
model_name: distilbert/distilroberta-base
model_revision: fb53ab8802853c8e4fbdbcd0529f21fc6f459b2b
chunking_method: sentence_token
max_length: 512
# Legacy character-window settings; unused by sentence_token mode.
window_chars: 800
overlap_chars: 200
overlap_tokens: 64

# Split & optimization
# val_fraction and seed drive clausetriage.models.encoder.train's single train/val split. The five-seed
# comparison (scripts/evaluate_encoder_nested.py) overrides seed per run and uses the fixed
# nested training/calibration/evaluation split of the saved TF-IDF results instead.
val_fraction: 0.2
seed: 42
lr: 3.0e-5
epochs: 4
batch_size: 16
grad_accum: 2
fp16: true
pos_weight_cap: 50.0

# Outputs
output_dir: outputs/encoder
mlflow_experiment: clausetriage-encoder