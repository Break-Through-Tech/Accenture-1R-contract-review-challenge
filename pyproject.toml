# Project metadata and tool configuration (see docs/development.md). Pytest is configured in pytest.ini.
# The requirements*.txt files stay the single source of truth for dependencies: the package's own
# dependencies are read from requirements-demo.txt, the base layer, and nothing is pinned here.

[project]
name = "clausetriage"
version = "0.1.0"
description = "Detects the 41 CUAD clause categories, scores clause risk with rules and ranks contracts for review."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# The demo runtime. The API server, training and tests need the larger layers (requirements-server.txt,
# requirements.txt), which pip installs with -r; setuptools can't read their -r lines.
dependencies = { file = ["requirements-demo.txt"] }

[tool.setuptools.packages.find]
# Only the clausetriage package. scripts/ and tests/ are run from the repo root, not installed.
# clausetriage/labels/ and clausetriage/models/ have no __init__.py, so namespace packages are included.
include = ["clausetriage*"]
namespaces = true

[tool.setuptools.package-data]
# The weight sets ship with the code. Everything else the code reads (data/, models/, results/,
# .venv/hf-cache) is found relative to the checkout, so install with `pip install -e .`
"clausetriage.risk.weights" = ["*.json"]

[tool.ruff]
# Matches what the code already uses (about 30 of ~18,000 lines are longer); E501 is not enforced
# and there is no formatter, so this only guides editors.
line-length = 120
# Agent worktrees live under .claude/worktrees/ in the main checkout; .venv, venv, .git and caches
# are excluded by ruff's defaults.
extend-exclude = [".claude"]
# .gitignore's `models/` rule also matches the tracked clausetriage/models/, which ruff would then skip.
respect-gitignore = false

[tool.ruff.lint]
# Bug-finding rules only, no import sorting or restyling:
#   E4/E7/E9  ruff's defaults: import placement, comparisons, bare except, syntax and IO errors
#   F         pyflakes: undefined names, unused imports and variables, redefinitions, bad f-strings
#   B         flake8-bugbear: mutable defaults, loop-variable closures, unreachable asserts...
#   W605      invalid escape sequences
#   PLE       pylint errors (bad format strings, return outside function, bad dunder signatures...)
#   T10       leftover debugger calls (breakpoint, pdb)
select = ["E4", "E7", "E9", "F", "B", "W605", "PLE", "T10"]
# B905 (zip() without strict=) fires 35 times across 20+ files; worth enabling once the branches merge.
ignore = ["B905"]

[tool.ruff.lint.flake8-bugbear]
# Gradio's documented idiom is `progress=gr.Progress()` as a default argument (B008).
extend-immutable-calls = ["gradio.Progress"]

[tool.ruff.lint.per-file-ignores]
# Existing findings, suppressed per file and rule instead of edited while parallel branches touch
# these files. Fix each one later and delete its entry (docs/development.md lists them).
"notebooks/baseline_test.ipynb" = ["F401"]
"scripts/evaluate_encoder_nested.py" = ["F401"]
"scripts/repair_per_category_aupr.py" = ["B023"]
"scripts/train_category_query.py" = ["F401"]
"scripts/train_contract_graph.py" = ["F401", "F811"]
"scripts/train_long_context.py" = ["F401"]
"scripts/train_set_prediction.py" = ["F401"]
"scripts/train_sparse_long_context.py" = ["F841"]
"clausetriage/chunking/token_chunker.py" = ["F401", "F811"]
"clausetriage/inference.py" = ["F401"]
"clausetriage/models/encoder/long_context.py" = ["F401"]
"clausetriage/models/encoder/set_prediction.py" = ["F401"]
"clausetriage/models/encoder/sparse_long_context.py" = ["F401"]
"clausetriage/models/encoder/train.py" = ["B028"]
"clausetriage/store/artifact_store.py" = ["F401"]
"tests/test_demo_model.py" = ["B028"]
"tests/test_retrieval_reranker.py" = ["F401"]
